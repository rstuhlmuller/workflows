---
name: Default Workflow
on: # yamllint disable-line rule:truthy
  workflow_call:
    inputs:
      checkov:
        description: Run Checkov before the merge gatekeeper.
        default: true
        required: false
        type: boolean
      merge-checks-timeout:
        description: Seconds to wait for other checks to complete.
        default: 600
        required: false
        type: number

permissions:
  checks: read
  statuses: read
  contents: read

jobs:
  checkov:
    if: ${{ inputs.checkov }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      - name: Checkov
        uses: bridgecrewio/checkov-action@8f61ce5b8a3afb4ca94d236b75201878ded6d2cd # v12.3077.0
        with:
          quiet: true
          output_format: cli,sarif
          output_file_path: results.sarif

      - name: Upload SARIF
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@7211b7c8077ea37d8641b6271f6a365a22a5fbfa # v4.36.0
        with:
          sarif_file: results.sarif

  merge-checks:
    runs-on: ubuntu-latest
    permissions:
      checks: read
      statuses: read
    steps:
      - name: Merge Gatekeeper
        uses: upsidr/merge-gatekeeper@09af7a82c1666d0e64d2bd8c01797a0bcfd3bb5d # v1
        with:
          token: ${{ github.token }}
          ignored: merge-checks
          timeout: ${{ inputs.merge-checks-timeout }}
          interval: 5
