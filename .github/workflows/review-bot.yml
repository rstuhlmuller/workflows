---
name: PR Agent
on:
  pull_request:
  workflow_call:
permissions:
  issues: write
  pull-requests: write
  contents: read
jobs:
  pr_agent_job:
    if: ${{ github.event.sender.type != 'Bot' }}
    runs-on: ubuntu-latest
    env:
      PR_AGENT_MODEL: gpt-3.5-turbo
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      TS_AUTH_KEY: ${{ secrets.TS_AUTH_KEY }}
    permissions:
      issues: write
      pull-requests: write
      contents: read
    steps:
      - name: Skip when OpenAI is unavailable
        if: ${{ env.OPENAI_API_KEY == '' }}
        run: echo "OPENAI_API_KEY is not configured for this repository; skipping PR Agent."

      - name: Tailscale
        if: ${{ env.OPENAI_API_KEY != '' && env.TS_AUTH_KEY != '' }}
        uses: tailscale/github-action@306e68a486fd2350f2bfc3b19fcd143891a4a2d8 # v4
        with:
          authkey: ${{ env.TS_AUTH_KEY }}
          tags: tag:ci
          statedir: /tmp/tailscale-state/

      - name: Review Bot
        if: ${{ env.OPENAI_API_KEY != '' }}
        uses: Stuhlmuller/ai-pr-reviewer@20341b7ac9970be60302fbc52a2831a2fd75d488 # v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENAI_API_KEY: ${{ env.OPENAI_API_KEY }}
        with:
          debug: true
          review_comment_lgtm: false
          openai_heavy_model: gpt-4
          path_filters: |-
            !dist/**
            !**/*.lock
